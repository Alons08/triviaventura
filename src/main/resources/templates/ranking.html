<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | Triviaventura</title>
    <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap-icons.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/base.css}" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-06GJ4W4ELZ"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-06GJ4W4ELZ');
    </script>
</head>

<body>
<div class="main-wrapper">
    <div class="content">
        <div class="content-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-3 py-lg-4">
        <!-- Player Info Section -->
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="player-info-card">
                    <div class="player-info-content">
                        <div class="player-avatar">
                            <span th:text="${#strings.substring(#authentication.name, 0, 1)}"></span>
                        </div>
                        <span class="ms-2"><strong>Jugador:</strong> <span th:text="${#authentication.name}"></span></span>
                        <span class="ms-auto fw-bold"><strong>Puntaje:</strong> <span th:text="${puntajeActual}"></span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Podium Top 3 -->
        <div th:if="${ranking != null and ranking.size() > 0}" class="row justify-content-center podium-row">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="podium">
                    <!-- 2º lugar (izquierda) -->
                    <div th:if="${ranking.size() > 1}" class="podium-item podium-second">
                        <div class="podium-avatar">
                            <span th:text="${#strings.substring(ranking[1][0], 0, 1)}"></span>
                        </div>
                        <span class="podium-medal"><i class="bi bi-star-fill"></i></span>
                        <span class="podium-name" th:text="${ranking[1][0]}"></span>
                        <span class="podium-score" th:text="${ranking[1][1]}"></span>
                    </div>

                    <!-- 1º lugar (centro, más alto) -->
                    <div class="podium-item podium-first">
                        <div class="podium-crown"><i class="bi bi-crown-fill"></i></div>
                        <div class="podium-avatar">
                            <span th:text="${#strings.substring(ranking[0][0], 0, 1)}"></span>
                        </div>
                        <span class="podium-medal"><i class="bi bi-trophy-fill"></i></span>
                        <span class="podium-name" th:text="${ranking[0][0]}"></span>
                        <span class="podium-score" th:text="${ranking[0][1]}"></span>
                    </div>

                    <!-- 3º lugar (derecha) -->
                    <div th:if="${ranking.size() > 2}" class="podium-item podium-third">
                        <div class="podium-avatar">
                            <span th:text="${#strings.substring(ranking[2][0], 0, 1)}"></span>
                        </div>
                        <span class="podium-medal"><i class="bi bi-award"></i></span>
                        <span class="podium-name" th:text="${ranking[2][0]}"></span>
                        <span class="podium-score" th:text="${ranking[2][1]}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla del resto del ranking -->
        <div th:if="${ranking != null and ranking.size() > 3}" class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="card ranking-card">
                    <div class="card-header text-center">
                        <h3><i class="bi bi-bar-chart-line me-2"></i>Resto del ranking</h3>
                    </div>
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-hover align-middle mb-0 w-100">
                            <thead>
                            <tr>
                                <th scope="col" class="ps-3">Posición</th>
                                <th scope="col">Jugador</th>
                                <th scope="col" class="text-end pe-3">Puntaje</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="usuario, iter : ${ranking}"
                                th:if="${iter.index > 2}">
                                <td class="ps-3">
                                    <div class="badge-position standard" th:text="${iter.index + 1}"></div>
                                </td>
                                <td>
                                    <span class="player-avatar-sm">
                                        <span th:text="${#strings.substring(usuario[0], 0, 1)}"></span>
                                    </span>
                                    <span class="player-name ms-2" th:text="${usuario[0]}"></span>
                                </td>
                                <td class="text-end pe-3 fw-bold" th:text="${usuario[1]}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${ranking != null and ranking.size() > 0}" class="row justify-content-center mt-3">
            <div class="col-12 col-lg-10 col-xl-8 text-center">
                <a th:href="@{/jugar}" class="btn btn-play">
                    <i class="bi bi-joystick me-2"></i>Jugar Ahora
                </a>
            </div>
        </div>
    </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>

<!-- Incluir el footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
